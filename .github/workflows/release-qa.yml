name: SCWork release QA
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate committed public release
        run: npm run check:release
      - name: Build from source
        run: npm run build:public
      - name: Validate freshly built release
        run: npm run check:release -- dist-public
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:public
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Test local generated storefront
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/scwork-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/dist-public/index.html >/dev/null && break; sleep 1; done
          npm run check:browser:release -- http://127.0.0.1:8000/dist-public/ ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scwork-browser-${{ matrix.engine }}
          path: qa-evidence/
          if-no-files-found: ignore
          retention-days: 7
